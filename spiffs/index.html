<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard Nor32</title>

    <link
        rel="stylesheet"
        href="/style.css">

</head>

<body>

    <header>

        <h1>
            Dashboard Nor32
        </h1>

    </header>

    <main class="cards">

        <div class="card">

            <h2>WiFi</h2>

            <div
                id="wifi"
                class="status">
                Cargando...
            </div>

        </div>

        <div class="card">

            <h2>Alarma</h2>

            <div
                id="alarma"
                class="status">
                Cargando...
            </div>

        </div>

        <div class="card">

            <h2>Temperatura</h2>

            <div
                id="temperatura"
                class="status">
                --.- °C
            </div>

        </div>

        <div class="card">

            <h2>Humedad</h2>

            <div
                id="humedad"
                class="status">
                --.- %
            </div>

        </div>

        <div class="card">

            <h2>Iluminación</h2>

            <div
                id="iluminacion"
                class="status">
                ---
            </div>

        </div>

        <div class="card">

            <h2>Aire Acondicionado</h2>

            <div
                id="aire"
                class="status">
                ---
            </div>

        </div>

        <div class="card">

            <h2>Tomacorrientes</h2>

            <div
                id="tomacorrientes"
                class="status">
                ---
            </div>

        </div>

    </main>

    <script src="/app.js"></script>

</body>

</html>
